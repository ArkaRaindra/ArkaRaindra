<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="120" viewBox="0 0 480 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="rowgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="480" height="120" rx="16" fill="url(#bg)"/>
  <rect width="480" height="120" rx="16" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.4"/>

  <!-- header -->
  <text x="240" y="20" font-family="'Segoe UI',sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" letter-spacing="3" opacity="0.8">MYANIMELIST</text>
  <text x="240" y="38" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">🌸 Recent Anime Activity</text>
  <line x1="20" y1="46" x2="460" y2="46" stroke="#7c3aed" stroke-width="0.7" opacity="0.4"/>

  
    <clipPath id="rclip0"><rect x="14" y="18" width="52" height="72" rx="6"/></clipPath>
    <!-- row bg -->
    <rect x="7" y="14" width="466" height="80" rx="10" fill="url(#rowgrad)" opacity="0.55"/>
    
    <!-- placeholder if no image -->
    <rect x="14" y="18" width="52" height="72" rx="6" fill="#1e1e2e"/>
    <!-- title -->
    <a href="https://myanimelist.net/anime/20847">
      <text x="78" y="36" font-family="'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.2">Seitokai Yakuindomo*</text>
    </a>
    <!-- ep badge -->
    <rect x="78" y="44" width="52" height="17" rx="8" fill="#7c3aed" opacity="0.85"/>
    <text x="104" y="56" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">+13 ep</text>
    <!-- score badge -->
    <rect x="136" y="44" width="44" height="17" rx="8" fill="#0f766e" opacity="0.85"/>
    <text x="158" y="56" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">⭐ —</text>
    <!-- date -->
    <text x="460" y="56" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">2026-05-03</text>
    

  <!-- footer -->
  <text x="240" y="113" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">@ArkaNotHere · via Jikan API</text>
</svg>