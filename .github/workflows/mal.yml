name: Update MAL Cards

on:
schedule:
- cron: "0 */6 * * *"
workflow_dispatch:

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  - name: Install Requests
    run: pip install requests

  - name: Run Script
    run: python update_mal.py

  - name: Commit Changes
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "actions@github.com"

      git add README.md

      git diff --quiet && git diff --staged --quiet || git commit -m "Update MAL Cards"

      git push
```
