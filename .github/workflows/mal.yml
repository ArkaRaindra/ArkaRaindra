name: Update completed anime list

on:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update README from MAL completed list
        run: |
          python <<'PY'
          import json
          import re
          import urllib.request

          USERNAME = "ArkaNotHere"
          LIMIT = 5
          url = f"https://api.jikan.moe/v4/users/{USERNAME}/animelist/completed?limit={LIMIT}&sort=desc"
          data = json.loads(urllib.request.urlopen(url).read().decode())
          items = data.get("data", [])

          rows = []
          for anime in items:
              title = anime["anime"]["title"]
              link = anime["anime"]["url"]
              score = anime.get("score", 0)
              rows.append(f'- [{title}]({link}) — score: {score}')

          block = "\n".join(rows)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"(<!-- MAL_COMPLETED_START -->)(.*?)(<!-- MAL_COMPLETED_END -->)"
          updated = re.sub(
              pattern,
              lambda m: f"{m.group(1)}\n{block}\n{m.group(3)}",
              readme,
              flags=re.S
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "update MAL completed list" || exit 0
          git push
