name: Update MAL History Card

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate MAL history SVG
        run: |
          python <<'PY'
          import json
          import urllib.request
          import urllib.error
          import re
          import base64
          import os

          USERNAME = "ArkaNotHere"
          LIMIT = 5

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode())

          def img_to_b64(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=5) as r:
                      return "data:image/jpeg;base64," + base64.b64encode(r.read()).decode()
              except:
                  return ""

          # Fetch history
          history_data = fetch(f"https://api.jikan.moe/v4/users/{USERNAME}/history/anime")
          history_items = history_data.get("data", [])[:LIMIT]

          # Get unique anime IDs from history
          seen = {}
          for item in history_items:
              aid = item["entry"]["mal_id"]
              if aid not in seen:
                  seen[aid] = {
                      "title": item["entry"]["name"],
                      "url": item["entry"]["url"],
                      "date": item["date"][:10],
                      "increment": item["increment"],
                      "mal_id": aid,
                  }

          anime_list = list(seen.values())[:LIMIT]

          # Fetch score & image for each anime
          import time
          for anime in anime_list:
              try:
                  detail = fetch(f"https://api.jikan.moe/v4/users/{USERNAME}/animelist/watching?q=&page=1")
                  # fallback: get image from anime endpoint
                  detail2 = fetch(f"https://api.jikan.moe/v4/anime/{anime['mal_id']}")
                  anime["image_url"] = detail2["data"]["images"]["jpg"]["image_url"]
                  anime["score"] = "—"
                  time.sleep(0.4)
              except:
                  anime["image_url"] = ""
                  anime["score"] = "—"

          # Try to get user scores from animelist
          try:
              all_status = ["watching", "completed", "onhold", "dropped", "plantowatch"]
              score_map = {}
              for status in all_status:
                  try:
                      data = fetch(f"https://api.jikan.moe/v4/users/{USERNAME}/animelist/{status}?limit=300")
                      for entry in data.get("data", []):
                          score_map[entry["anime"]["mal_id"]] = entry.get("score", 0)
                      time.sleep(0.35)
                  except:
                      pass
              for anime in anime_list:
                  s = score_map.get(anime["mal_id"], 0)
                  anime["score"] = str(s) if s else "—"
          except:
              pass

          # Embed images as base64
          for anime in anime_list:
              if anime.get("image_url"):
                  anime["img_b64"] = img_to_b64(anime["image_url"])
              else:
                  anime["img_b64"] = ""

          # ── SVG Generation ──────────────────────────────────────────────
          CARD_W = 480
          ROW_H = 80
          IMG_W = 52
          IMG_H = 72
          PAD = 14
          TOTAL_H = PAD + len(anime_list) * (ROW_H + 8) + PAD
          SVG_H = max(TOTAL_H, 120)

          rows_svg = ""
          for i, anime in enumerate(anime_list):
              y = PAD + i * (ROW_H + 8)
              title = anime["title"]
              if len(title) > 32:
                  title = title[:30] + "…"
              score_txt = anime["score"]
              date_txt = anime["date"]
              ep_txt = f"+{anime['increment']} ep"

              img_tag = ""
              if anime["img_b64"]:
                  img_tag = f'''<image href="{anime['img_b64']}" x="{PAD}" y="{y + (ROW_H - IMG_H)//2}" width="{IMG_W}" height="{IMG_H}" clip-path="url(#rclip{i})" preserveAspectRatio="xMidYMid slice"/>'''

              clip = f'''<clipPath id="rclip{i}"><rect x="{PAD}" y="{y + (ROW_H - IMG_H)//2}" width="{IMG_W}" height="{IMG_H}" rx="6"/></clipPath>'''

              tx = PAD + IMG_W + 12
              rows_svg += f'''
              {clip}
              <!-- row bg -->
              <rect x="{PAD//2}" y="{y}" width="{CARD_W - PAD}" height="{ROW_H}" rx="10" fill="url(#rowgrad)" opacity="0.55"/>
              {img_tag}
              <!-- placeholder if no image -->
              {"" if anime["img_b64"] else f'<rect x="{PAD}" y="{y + (ROW_H - IMG_H)//2}" width="{IMG_W}" height="{IMG_H}" rx="6" fill="#1e1e2e"/>'}
              <!-- title -->
              <a href="{anime['url']}">
                <text x="{tx}" y="{y + 22}" font-family="'Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.2">{title}</text>
              </a>
              <!-- ep badge -->
              <rect x="{tx}" y="{y + 30}" width="52" height="17" rx="8" fill="#7c3aed" opacity="0.85"/>
              <text x="{tx + 26}" y="{y + 42}" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">{ep_txt}</text>
              <!-- score badge -->
              <rect x="{tx + 58}" y="{y + 30}" width="44" height="17" rx="8" fill="#0f766e" opacity="0.85"/>
              <text x="{tx + 80}" y="{y + 42}" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">⭐ {score_txt}</text>
              <!-- date -->
              <text x="{CARD_W - PAD - 6}" y="{y + 42}" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">{date_txt}</text>
              '''

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="{CARD_W}" height="{SVG_H}" viewBox="0 0 {CARD_W} {SVG_H}">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0f0c29"/>
                <stop offset="100%" stop-color="#1a1035"/>
              </linearGradient>
              <linearGradient id="rowgrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- background -->
            <rect width="{CARD_W}" height="{SVG_H}" rx="16" fill="url(#bg)"/>
            <rect width="{CARD_W}" height="{SVG_H}" rx="16" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.4"/>

            <!-- header -->
            <text x="{CARD_W//2}" y="20" font-family="'Segoe UI',sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" letter-spacing="3" opacity="0.8">MYANIMELIST</text>
            <text x="{CARD_W//2}" y="38" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">🌸 Recent Anime Activity</text>
            <line x1="20" y1="46" x2="{CARD_W-20}" y2="46" stroke="#7c3aed" stroke-width="0.7" opacity="0.4"/>

            {rows_svg}

            <!-- footer -->
            <text x="{CARD_W//2}" y="{SVG_H - 7}" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">@{USERNAME} · via Jikan API</text>
          </svg>'''

          os.makedirs("assets", exist_ok=True)
          with open("assets/mal-history.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("SVG generated successfully.")

          # Update README
          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          img_md = "![MAL History](assets/mal-history.svg)"
          pattern = r"<!-- MAL_HISTORY:start -->.*?<!-- MAL_HISTORY:end -->"
          replacement = f"<!-- MAL_HISTORY:start -->\n{img_md}\n<!-- MAL_HISTORY:end -->"

          if re.search(pattern, readme, flags=re.S):
              updated = re.sub(pattern, replacement, readme, flags=re.S)
          else:
              updated = readme + f"\n\n## 🌸 Recent MAL Activity\n\n{replacement}\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)

          print("README updated.")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/mal-history.svg
          git diff --cached --quiet || git commit -m "chore: update MAL history card"
          git push
